[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compras-crawler"
version = "0.1.0"
description = "Compras.gov.br data crawler and sync pipeline"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1.3",
  "pytest>=8.0.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
web-test = ["httpx>=0.27,<1"]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
compras-crawler = "compras_crawler.cli:main"
compras-mcp = "compras_crawler.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"compras_crawler.web" = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
